spring.application.name=order-service

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/order_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Kafka Consumer
spring.kafka.consumer.group-id=order-service-payment-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.orderservice.*
spring.kafka.consumer.properties[spring.json.use.type.headers]=true
spring.kafka.consumer.properties[spring.json.type.mapping]=com.example.payment_service.dto.PaymentEvent:com.example.orderservice.dto.PaymentEvent,com.example.delivery_service.dto.DeliveryCreatedEvent:com.example.orderservice.dto.DeliveryEvent